# oelint-adv defaults for this layer. Auto-loaded when oelint-adv runs with this
# directory as the working directory (see contrib/oelint/run-oelint.sh).
#
# Keep exceptions inline as '# nooelint: <rule.id>' comments next to each finding
# so new recipes are always fully linted and every exception is documented in
# place. Only rules that provably never apply to the whole layer are suppressed
# here:
#
#   * oelint.var.bbclassextend - meta-freescale-3rdparty is a BSP layer for
#     third-party boards; every recipe packages a bootloader, kernel, firmware
#     blob or board configuration for a target machine. None is a
#     cross-compilable library, so BBCLASSEXTEND (native/nativesdk) does not
#     apply anywhere in the layer.
#   * oelint.var.suggestedvar.BUGTRACKER - an advisory 'suggested' variable, unset
#     in all 21 recipes here and nowhere in the openembedded-core or
#     meta-freescale include chain they pull in, so none inherits one either.
#     Every recipe packages a board vendor's BSP fork (Boundary Devices,
#     Kontron, Variscite, Olimex, NXP QorIQ) or a prebuilt firmware/config blob.
#     Where such a fork is on GitHub its issue tracker exists but is not where
#     BSP defects are triaged - those go to the vendor's support channel, which
#     BUGTRACKER cannot express - so naming one would misdirect bug reports.
#     Set it inline on the rare recipe that gains a real tracker.
#   * oelint.var.suggestedvar.CVE_PRODUCT - an advisory 'suggested' variable that
#     this layer cannot usefully answer per recipe. Of the 19 recipes still
#     reporting it, 9 already inherit a correct value that oelint cannot see,
#     because it comes from a layer outside the scan: the five u-boot-* recipes
#     require oe-core's u-boot.inc, which sets "denx:u-boot", and the four
#     linux-* recipes inherit kernel.bbclass, which sets
#     "linux_kernel linux:linux". Restating either locally would freeze a value
#     oe-core maintains. The other 10 - two u-boot boot scripts, four Broadcom
#     nvram config blobs, a MAC-persistency init script, the Timesys MQX
#     helpers and ti-18xx-wlconf - package configuration data or vendor
#     utilities with no upstream NVD product, and guessing one would create
#     false or missed CVE matches. Set it inline on a recipe that has a real
#     product, as imx-atf-boundary and qoriq-atf do for TF-A.
[oelint]
release = wrynose
suppress =
    oelint.var.bbclassextend
    oelint.var.suggestedvar.BUGTRACKER
    oelint.var.suggestedvar.CVE_PRODUCT
