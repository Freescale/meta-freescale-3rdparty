# oelint-adv defaults for this layer. Auto-loaded when oelint-adv runs with this
# directory as the working directory (see contrib/oelint/run-oelint.sh).
#
# Keep exceptions inline as '# nooelint: <rule.id>' comments next to each finding
# so new recipes are always fully linted and every exception is documented in
# place. Only rules that provably never apply to the whole layer are suppressed
# here:
#
#   * oelint.var.bbclassextend - meta-freescale-3rdparty is a BSP layer for
#     third-party boards; every recipe packages a bootloader, kernel, firmware
#     blob or board configuration for a target machine. None is a
#     cross-compilable library, so BBCLASSEXTEND (native/nativesdk) does not
#     apply anywhere in the layer.
[oelint]
release = wrynose
suppress = oelint.var.bbclassextend
